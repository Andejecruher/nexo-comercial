# Documented construction for Nexo Comercial. This file is not a GitHub Actions
# workflow: it lives outside .github/workflows and the trigger block below is
# commented, so nothing here deploys. Jobs, images, env and verify steps are the
# pipeline that already works, with Nexo Comercial names.
#
# To run it later: uncomment the trigger, copy this file to
# .github/workflows/deploy-gcp.yml, and follow docs/DEPLOYMENT_GCP.md.
# Services: nexo-api, nexo-worker, nexo-realtime-relay, nexo-frontend, nexo-migrator.
name: Deploy GCP

# Migracion Railway -> GCP (Cloud Run + Artifact Registry + Cloud SQL + Secret Manager).
# Guia completa: docs/DEPLOYMENT_GCP.md
#
# Flujo:
#   detect -> quality/backend-ci (reusable, sin Docker duplicado) -> ci-gate
#   build  -> buildx push paralelo de runner (nexo-api/nexo-worker), tools (migrator), frontend
#   migrate -> Cloud Run Job `nexo-migrator` ejecuta `prisma migrate deploy` (bloquea deploy backend si falla)
#   deploy  -> worker y relay antes de API; frontend despues del backend
#   verify  -> salud, Cloud Tasks/Scheduler, Pub/Sub y flags de costo por rol
#   docs    -> docs/analysis/realtime-implementation.md (costos y rollout).
#
# Secrets requeridos en GitHub (Settings -> Secrets and variables -> Actions):
#   GCP_PROJECT_ID  - ID del proyecto GCP
#   WIF_PROVIDER    - Workload Identity Federation provider
#   GH_SA_CICD      - service account email del CI/CD
# Mas el pool/WIF ya configurado en GCP (ver docs/DEPLOYMENT_GCP.md sec 2.e).
#
# Secrets requeridos en Secret Manager (creados con `gcloud secrets create` + versión):
#   DATABASE_URL, DB_USER, DB_PASS, DB_NAME, INSTANCE_CONNECTION_NAME,
#   JWT_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY,
#   WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_ID, WHATSAPP_APP_SECRET,
#   WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_BUSINESS_ACCOUNT_ID,
#   MAILTRAP_API_TOKEN, MAILTRAP_API_URL, MAIL_FROM_ADDRESS,
#   MAIL_REPLY_TO_ADDRESS, MAIL_SUPPORT_EMAIL,
#   OPENAI_API_KEY, NVIDIA_API_KEY, ANTHROPIC_API_KEY,
#   GOOGLE_DRIVE_FOLDER_ID, GOOGLE_OAUTH_CLIENT_ID,
#   GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_DRIVE_REFRESH_TOKEN,
#   DOCUMENT_AI_PROCESSOR_ID
#
# Variables de entorno en GitHub (Settings -> Variables):
#   GCP_API_BASE_URL, GCP_FRONTEND_URL, GCP_DOC_AI_LOC,
#   GCP_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL (SA OIDC de la push subscription;
#   PUBSUB_PUSH_AUDIENCE se deriva de GCP_API_BASE_URL)
#
# Presupuesto de conexiones Cloud SQL (detalle: docs/CLOUD_SQL_CONNECTION.md):
#   Cada instancia de Cloud Run abre su propio pool de Prisma, asi que el peor
#   caso es  SUM(max-instances x PRISMA_CONNECTION_LIMIT)  sobre TODOS los
#   servicios que usan el socket (api + worker + relay) mas el job migrador.
#   Regla de oro: no subir --max-instances ni PRISMA_CONNECTION_LIMIT sin haber
#   escalado antes la memoria/tier de Cloud SQL.
#   Las variables DB_* de `env:` son la unica fuente de verdad: se usan para
#   desplegar y para verificar (verify-production). No las dupliques inline.

# Trigger recorded from the working pipeline. Commented so this file cannot
# deploy. Restore it together with the copy to .github/workflows/deploy-gcp.yml.
# on:
#   push:
#     branches: [main]
#     paths:
#       - "backend/**"
#       - "frontend/**"
#       - "pnpm-lock.yaml"
#       - "pnpm-workspace.yaml"
#       - "package.json"
#       - ".dockerignore"
#       - "backend/Dockerfile"
#       - "frontend/Dockerfile"
#       - ".github/workflows/deploy-gcp.yml"
#       - ".github/workflows/quality.yml"
#       - ".github/workflows/backend-ci.yml"
#       - ".github/actions/**"
#   workflow_dispatch:
#     inputs:
#       surfaces:
#         description: Components to deploy. Backend includes migrations, worker, relay, tasks, and API.
#         required: true
#         type: choice
#         default: all
#         options:
#           - all
#           - backend
#           - frontend

permissions:
  contents: read

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  AR_REPO: nexo-comercial
  DB_INSTANCE: nexo-comercial
  SA_RUN: nexo-comercial-run-sa
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  # ── Presupuesto de conexiones Cloud SQL (unica fuente de verdad) ───────────
  # api y worker comparten DB_MAX_INSTANCES pero NO el pool: el worker lleva
  # su propio limite mas chico. El relay tiene su propio par.
  # Peor caso = DB_MAX_INSTANCES x DB_CONNECTION_LIMIT          (api)     = 25
  #            + DB_MAX_INSTANCES x DB_WORKER_CONNECTION_LIMIT (worker)  = 10
  #            + DB_RELAY_MAX_INSTANCES x DB_RELAY_CONNECTION_LIMIT      =  4
  #            = 39 conexiones (+1 del job migrator = 40).
  # Antes de subir cualquiera de estos valores, escala el tier de Cloud SQL
  # y verifica su max_connections real.
  DB_MAX_INSTANCES: "5"
  DB_CONNECTION_LIMIT: "5"
  DB_WORKER_CONNECTION_LIMIT: "2"
  DB_RELAY_MAX_INSTANCES: "2"
  DB_RELAY_CONNECTION_LIMIT: "2"

jobs:
  detect:
    name: Detect changed surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      git_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: filter
        run: |
          set -euo pipefail
          frontend=false
          backend=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.surfaces }}" in
              all)
                frontend=true
                backend=true
                ;;
              backend)
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
              *)
                echo "::error::Unsupported deployment surface: ${{ inputs.surfaces }}"
                exit 1
                ;;
            esac
            echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
            echo "backend=$backend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # A first push or a shallow history cannot be classified safely.
            # Deploy both surfaces instead of risking an incomplete release.
            frontend=true
            backend=true
          else
            changed="$(git diff --name-only "$BEFORE" "$AFTER")"
            printf '%s\n' "$changed"
            # Each Dockerfile copies its whole application directory, so every
            # source change remains deployable. Package manifests are shared:
            # each image copies the other workspace manifest before installing.
            if printf '%s\n' "$changed" | grep -qE '^(frontend/|backend/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.dockerignore$|\.github/workflows/deploy-gcp\.yml$|\.github/workflows/quality\.yml$|\.github/actions/)'; then
              frontend=true
            fi
            backend_changed="$(printf '%s\n' "$changed" | grep -E '^backend/' || true)"
            # Backend production TypeScript excludes this exact directory. Test-only
            # changes are validated in their PR but do not require a production
            # image, migration, or Cloud Run revision.
            backend_runtime_changed="$(printf '%s\n' "$backend_changed" | grep -vE '^backend/src/__tests__/' || true)"
            if [[ -n "$backend_runtime_changed" ]] \
              || printf '%s\n' "$changed" | grep -qE '^(frontend/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.dockerignore$|\.github/workflows/deploy-gcp\.yml$|\.github/workflows/backend-ci\.yml$|\.github/actions/)'; then
              backend=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          if [[ "$frontend" != true && "$backend" != true ]]; then
            echo "::notice::No deployable surfaces detected; production jobs will be skipped."
          fi

  quality:
    name: Frontend quality
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      skip_docker_smoke: true
    permissions:
      contents: read
      actions: write

  backend-ci:
    name: Backend CI
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      ci_profile: deploy
      skip_docker_smoke: true
    permissions:
      contents: read
      actions: write

  ci-gate:
    name: CI gate
    needs: [detect, quality, backend-ci]
    if: >
      always() && !cancelled()
      && (needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful or skipped CI
        run: |
          set -euo pipefail
          frontend='${{ needs.detect.outputs.frontend }}'
          backend='${{ needs.detect.outputs.backend }}'
          quality='${{ needs.quality.result }}'
          backend_ci='${{ needs.backend-ci.result }}'
          detect='${{ needs.detect.result }}'

          if [[ "$detect" != "success" ]]; then
            echo "::error::Change detection failed ($detect)."
            exit 1
          fi
          if [[ "$frontend" == "true" && "$quality" != "success" ]]; then
            echo "::error::Frontend quality must succeed before deploy (was $quality)."
            exit 1
          fi
          if [[ "$backend" == "true" && "$backend_ci" != "success" ]]; then
            echo "::error::Backend CI must succeed before deploy (was $backend_ci)."
            exit 1
          fi

  build-backend-runner:
    name: Build & push backend runner
    needs: [detect, ci-gate]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-docker-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build & push backend (runner -> nexo-api)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: true
          provenance: false
          cache-from: type=gha,scope=backend-runner
          cache-to: type=gha,mode=max,scope=backend-runner,ignore-error=true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/nexo-api:sha-${{ needs.detect.outputs.git_sha }}

      - name: Build & push backend (worker -> nexo-worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          push: true
          provenance: false
          cache-from: type=gha,scope=backend-runner
          cache-to: type=gha,mode=max,scope=backend-runner,ignore-error=true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/nexo-worker:sha-${{ needs.detect.outputs.git_sha }}

  build-backend-tools:
    name: Build & push migrator
    needs: [detect, ci-gate]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-docker-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build & push backend (tools -> migrator)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: tools
          push: true
          provenance: false
          cache-from: type=gha,scope=backend-tools
          cache-to: type=gha,mode=max,scope=backend-tools,ignore-error=true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/nexo-tools:sha-${{ needs.detect.outputs.git_sha }}

  build-frontend:
    name: Build & push frontend
    needs: [detect, ci-gate]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-docker-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build & push frontend (prod)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          provenance: false
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod,ignore-error=true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.GCP_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.GCP_API_BASE_URL }}
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/nexo-frontend:sha-${{ needs.detect.outputs.git_sha }}

  migrate:
    name: Run Prisma migrations (Cloud Run Job)
    needs: [detect, ci-gate, build-backend-tools]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.build-backend-tools.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GIT_SHA: ${{ needs.detect.outputs.git_sha }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Create/update migrator job
        run: |
          set -euo pipefail
          INST_CN="${GCP_PROJECT_ID}:${GCP_REGION}:${DB_INSTANCE}"
          IMG_TOOLS="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/nexo-tools:sha-${GIT_SHA}"
          SA_EMAIL="${SA_RUN}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run jobs deploy nexo-migrator \
            --image="$IMG_TOOLS" --region="$GCP_REGION" \
            --tasks=1 --max-retries=0 --task-timeout=10m \
            --command="/usr/local/bin/nexo-prod-migrate.sh" \
            --args="" \
            --set-env-vars="NODE_ENV=production" \
            --set-cloudsql-instances="$INST_CN" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,CLOUDSQL_DB_USER=DB_USER:latest,CLOUDSQL_DB_PASS=DB_PASS:latest,CLOUDSQL_DB_NAME=DB_NAME:latest,CLOUDSQL_INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest" \
            --service-account="$SA_EMAIL"

      - name: Execute migrations (blocks deploy on failure)
        run: |
          set -euo pipefail
          # --wait propaga el exit code del job a la action: si migrate deploy falla,
          # los jobs de deploy backend (que dependen de este) no se ejecutan.
          gcloud run jobs execute nexo-migrator --region "$GCP_REGION" --wait

  deploy-api:
    name: Deploy nexo-api
    needs:
      [
        detect,
        ci-gate,
        build-backend-runner,
        migrate,
        deploy-worker,
        deploy-realtime-relay,
        activate-tasks,
      ]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.build-backend-runner.result == 'success' && needs.migrate.result == 'success' && needs.deploy-worker.result == 'success' && needs.deploy-realtime-relay.result == 'success' && needs.activate-tasks.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SHA: ${{ needs.detect.outputs.git_sha }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Compose Cloud Run refs
        run: |
          set -euo pipefail
          {
            echo "IMG=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}"
            echo "INST_CN=${GCP_PROJECT_ID}:${GCP_REGION}:${DB_INSTANCE}"
            echo "SA_RUN_EMAIL=${SA_RUN}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_ENV"

      - name: Deploy nexo-api
        run: |
          set -euo pipefail
          gcloud run deploy nexo-api \
            --image="$IMG/nexo-api:sha-$SHA" --region="$GCP_REGION" --allow-unauthenticated \
            --service-account="$SA_RUN_EMAIL" --port=8080 \
            --min-instances=0 --max-instances=$DB_MAX_INSTANCES \
            --clear-vpc-connector \
            --concurrency=80 --timeout=3600 \
            --cpu=1 --memory=1Gi --cpu-boost --cpu-throttling \
            --set-env-vars="NODE_ENV=production,BATCHING_WINDOW_MS=5000,BATCHING_MAX_WAIT_MS=30000,BASE_URL=${{ vars.GCP_API_BASE_URL }},FRONTEND_URL=${{ vars.GCP_FRONTEND_URL }},CORS_ORIGIN=${{ vars.GCP_FRONTEND_URL }},GOOGLE_CLOUD_PROJECT_ID=$GCP_PROJECT_ID,DOCUMENT_AI_LOCATION=${{ vars.GCP_DOC_AI_LOC }},ENABLE_XLSX_EXPORT=true,WORKERS_ENABLED=false,BACKGROUND_EXECUTION_BACKEND=cloud_tasks,GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_LOCATION=$GCP_REGION,TASKS_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }},TASKS_AI_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-ai,TASKS_DELIVERY_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-delivery,TASKS_DOCUMENT_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-documents,WORKER_SERVICE_URL=${{ vars.GCP_WORKER_SERVICE_URL }},TASKS_SERVICE_ACCOUNT_EMAIL=${{ vars.GCP_TASKS_SERVICE_ACCOUNT_EMAIL }},WS_ENABLED=true,REALTIME_DURABLE_ENABLED=true,REALTIME_IMMEDIATE_PUBLISH_ENABLED=true,INBOUND_EAGER_INGESTION_ENABLED=true,SOCKETIO_PUBSUB_ADAPTER_ENABLED=true,SOCKETIO_PUBSUB_TOPIC=socketio-adapter,PUBSUB_PUSH_AUDIENCE=${{ vars.GCP_API_BASE_URL }},PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL=${{ vars.GCP_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL }},PRISMA_CONNECTION_LIMIT=$DB_CONNECTION_LIMIT,MAIL_PROVIDER=mailtrap,MAIL_FROM_NAME=Nexo Comercial,MAIL_PLATFORM_NAME=Nexo Comercial,MAIL_TIME_ZONE=America/Mexico_City,MAIL_SEND_TIMEOUT_MS=10000,GCS_SIGNER_SERVICE_ACCOUNT=${{ vars.GCS_SIGNER_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances="$INST_CN" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,CLOUDSQL_DB_USER=DB_USER:latest,CLOUDSQL_DB_PASS=DB_PASS:latest,CLOUDSQL_DB_NAME=DB_NAME:latest,CLOUDSQL_INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_APP_ID=WHATSAPP_APP_ID:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest,WHATSAPP_BUSINESS_ACCOUNT_ID=WHATSAPP_BUSINESS_ACCOUNT_ID:latest,MAILTRAP_API_TOKEN=MAILTRAP_API_TOKEN:latest,MAILTRAP_API_URL=MAILTRAP_API_URL:latest,MAIL_FROM_ADDRESS=MAIL_FROM_ADDRESS:latest,MAIL_REPLY_TO_ADDRESS=MAIL_REPLY_TO_ADDRESS:latest,MAIL_SUPPORT_EMAIL=MAIL_SUPPORT_EMAIL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_DRIVE_FOLDER_ID=GOOGLE_DRIVE_FOLDER_ID:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,GOOGLE_DRIVE_REFRESH_TOKEN=GOOGLE_DRIVE_REFRESH_TOKEN:latest,DOCUMENT_AI_PROCESSOR_ID=DOCUMENT_AI_PROCESSOR_ID:latest"

  deploy-worker:
    name: Deploy nexo-worker
    needs: [detect, ci-gate, build-backend-runner, migrate]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.build-backend-runner.result == 'success' && needs.migrate.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SHA: ${{ needs.detect.outputs.git_sha }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Compose Cloud Run refs
        run: |
          set -euo pipefail
          {
            echo "IMG=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}"
            echo "INST_CN=${GCP_PROJECT_ID}:${GCP_REGION}:${DB_INSTANCE}"
            echo "SA_RUN_EMAIL=${SA_RUN}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_ENV"

      - name: Deploy nexo-worker
        run: |
          set -euo pipefail
          # Image `worker` stage already runs `tini -- node dist/worker.js`.
          # Empty command/args restore image defaults and drop sticky overrides
          # from older revisions (`--command=node` replaces ENTRYPOINT).
          gcloud run deploy nexo-worker \
            --image="$IMG/nexo-worker:sha-$SHA" --region="$GCP_REGION" --no-allow-unauthenticated \
            --ingress=all \
            --service-account="$SA_RUN_EMAIL" --port=8080 \
            --min-instances=0 --max-instances=$DB_MAX_INSTANCES \
            --clear-vpc-connector \
            --concurrency=50 --timeout=300 \
            --cpu=1 --memory=1Gi --no-cpu-boost --cpu-throttling \
            --command="" --args="" \
            --set-env-vars="NODE_ENV=production,BATCHING_WINDOW_MS=5000,BATCHING_MAX_WAIT_MS=30000,BASE_URL=${{ vars.GCP_API_BASE_URL }},FRONTEND_URL=${{ vars.GCP_FRONTEND_URL }},CORS_ORIGIN=${{ vars.GCP_FRONTEND_URL }},GOOGLE_CLOUD_PROJECT_ID=$GCP_PROJECT_ID,DOCUMENT_AI_LOCATION=${{ vars.GCP_DOC_AI_LOC }},ENABLE_XLSX_EXPORT=true,WORKERS_ENABLED=true,BACKGROUND_EXECUTION_BACKEND=cloud_tasks,GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_LOCATION=$GCP_REGION,TASKS_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }},TASKS_AI_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-ai,TASKS_DELIVERY_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-delivery,TASKS_DOCUMENT_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-documents,WORKER_SERVICE_URL=${{ vars.GCP_WORKER_SERVICE_URL }},TASKS_SERVICE_ACCOUNT_EMAIL=${{ vars.GCP_TASKS_SERVICE_ACCOUNT_EMAIL }},WS_ENABLED=false,REALTIME_DURABLE_ENABLED=true,REALTIME_IMMEDIATE_PUBLISH_ENABLED=true,PRISMA_CONNECTION_LIMIT=$DB_WORKER_CONNECTION_LIMIT,WORKER_HEALTH_PORT=8080,MAIL_PROVIDER=mailtrap,MAIL_FROM_NAME=Nexo Comercial,MAIL_PLATFORM_NAME=Nexo Comercial,MAIL_TIME_ZONE=America/Mexico_City,MAIL_SEND_TIMEOUT_MS=10000,GCS_SIGNER_SERVICE_ACCOUNT=${{ vars.GCS_SIGNER_SERVICE_ACCOUNT }},DISABLE_INTERNAL_POLLING=true" \
            --add-cloudsql-instances="$INST_CN" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,CLOUDSQL_DB_USER=DB_USER:latest,CLOUDSQL_DB_PASS=DB_PASS:latest,CLOUDSQL_DB_NAME=DB_NAME:latest,CLOUDSQL_INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_APP_ID=WHATSAPP_APP_ID:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest,WHATSAPP_BUSINESS_ACCOUNT_ID=WHATSAPP_BUSINESS_ACCOUNT_ID:latest,MAILTRAP_API_TOKEN=MAILTRAP_API_TOKEN:latest,MAILTRAP_API_URL=MAILTRAP_API_URL:latest,MAIL_FROM_ADDRESS=MAIL_FROM_ADDRESS:latest,MAIL_REPLY_TO_ADDRESS=MAIL_REPLY_TO_ADDRESS:latest,MAIL_SUPPORT_EMAIL=MAIL_SUPPORT_EMAIL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_DRIVE_FOLDER_ID=GOOGLE_DRIVE_FOLDER_ID:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,GOOGLE_DRIVE_REFRESH_TOKEN=GOOGLE_DRIVE_REFRESH_TOKEN:latest,DOCUMENT_AI_PROCESSOR_ID=DOCUMENT_AI_PROCESSOR_ID:latest"

  deploy-realtime-relay:
    name: Deploy nexo-realtime-relay
    needs: [detect, ci-gate, build-backend-runner, migrate]
    if: always() && !cancelled() && needs.ci-gate.result == 'success' && needs.build-backend-runner.result == 'success' && needs.migrate.result == 'success' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SHA: ${{ needs.detect.outputs.git_sha }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Compose Cloud Run refs
        run: |
          set -euo pipefail
          {
            echo "IMG=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}"
            echo "INST_CN=${GCP_PROJECT_ID}:${GCP_REGION}:${DB_INSTANCE}"
            echo "SA_RUN_EMAIL=${SA_RUN}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_ENV"

      - name: Deploy nexo-realtime-relay
        run: |
          set -euo pipefail
          # Recovery requires CPU outside requests; it does not run AI tasks.
          gcloud run deploy nexo-realtime-relay \
            --image="$IMG/nexo-worker:sha-$SHA" --region="$GCP_REGION" --no-allow-unauthenticated \
            --ingress=all \
            --service-account="$SA_RUN_EMAIL" --port=8080 \
            --min-instances=0 --max-instances=$DB_RELAY_MAX_INSTANCES \
            --clear-vpc-connector \
            --concurrency=1 --timeout=300 \
            --cpu=1 --memory=1Gi --cpu-boost --cpu-throttling \
            --command=node --args=dist/realtime-relay.js \
            --set-env-vars="NODE_ENV=production,BATCHING_WINDOW_MS=5000,BATCHING_MAX_WAIT_MS=30000,BASE_URL=${{ vars.GCP_API_BASE_URL }},FRONTEND_URL=${{ vars.GCP_FRONTEND_URL }},CORS_ORIGIN=${{ vars.GCP_FRONTEND_URL }},GOOGLE_CLOUD_PROJECT_ID=$GCP_PROJECT_ID,DOCUMENT_AI_LOCATION=${{ vars.GCP_DOC_AI_LOC }},ENABLE_XLSX_EXPORT=true,WORKERS_ENABLED=true,BACKGROUND_EXECUTION_BACKEND=cloud_tasks,GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_LOCATION=$GCP_REGION,TASKS_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }},TASKS_AI_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-ai,TASKS_DELIVERY_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-delivery,TASKS_DOCUMENT_QUEUE_NAME=${{ vars.GCP_TASKS_QUEUE_NAME }}-documents,WORKER_SERVICE_URL=${{ vars.GCP_WORKER_SERVICE_URL }},TASKS_SERVICE_ACCOUNT_EMAIL=${{ vars.GCP_TASKS_SERVICE_ACCOUNT_EMAIL }},WS_ENABLED=false,REALTIME_DURABLE_ENABLED=true,REALTIME_IMMEDIATE_PUBLISH_ENABLED=true,PRISMA_CONNECTION_LIMIT=$DB_RELAY_CONNECTION_LIMIT,WORKER_HEALTH_PORT=8080,MAIL_PROVIDER=mailtrap,MAIL_FROM_NAME=Nexo Comercial,MAIL_PLATFORM_NAME=Nexo Comercial,MAIL_TIME_ZONE=America/Mexico_City,MAIL_SEND_TIMEOUT_MS=10000,GCS_SIGNER_SERVICE_ACCOUNT=${{ vars.GCS_SIGNER_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances="$INST_CN" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,CLOUDSQL_DB_USER=DB_USER:latest,CLOUDSQL_DB_PASS=DB_PASS:latest,CLOUDSQL_DB_NAME=DB_NAME:latest,CLOUDSQL_INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_APP_ID=WHATSAPP_APP_ID:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest,WHATSAPP_BUSINESS_ACCOUNT_ID=WHATSAPP_BUSINESS_ACCOUNT_ID:latest,MAILTRAP_API_TOKEN=MAILTRAP_API_TOKEN:latest,MAILTRAP_API_URL=MAILTRAP_API_URL:latest,MAIL_FROM_ADDRESS=MAIL_FROM_ADDRESS:latest,MAIL_REPLY_TO_ADDRESS=MAIL_REPLY_TO_ADDRESS:latest,MAIL_SUPPORT_EMAIL=MAIL_SUPPORT_EMAIL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,NVIDIA_API_KEY=NVIDIA_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_DRIVE_FOLDER_ID=GOOGLE_DRIVE_FOLDER_ID:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,GOOGLE_DRIVE_REFRESH_TOKEN=GOOGLE_DRIVE_REFRESH_TOKEN:latest,DOCUMENT_AI_PROCESSOR_ID=DOCUMENT_AI_PROCESSOR_ID:latest"

  activate-tasks:
    name: Activate Cloud Tasks processing
    needs: [deploy-worker]
    if: always() && !cancelled() && needs.deploy-worker.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Activate Cloud Tasks processing
        run: |
          set -euo pipefail
          QUEUE_NAME="${{ vars.GCP_TASKS_QUEUE_NAME }}"
          TASK_QUEUE_BASE="$QUEUE_NAME"
          for QUEUE_NAME in "$TASK_QUEUE_BASE" "$TASK_QUEUE_BASE-ai" "$TASK_QUEUE_BASE-delivery" "$TASK_QUEUE_BASE-documents"; do
            if ! gcloud tasks queues describe "$QUEUE_NAME" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud tasks queues create "$QUEUE_NAME" \
                --location="$GCP_REGION" --project="$GCP_PROJECT_ID" \
                --max-dispatches-per-second=20 --max-concurrent-dispatches=10 \
                --max-attempts=8 --min-backoff=10s --max-backoff=600s \
                --max-doublings=5 --max-retry-duration=3600s
            fi
            QUEUE_STATE="$(gcloud tasks queues describe "$QUEUE_NAME" \
              --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(state)')"
            if [[ "$QUEUE_STATE" != "RUNNING" ]]; then
              gcloud tasks queues resume "$QUEUE_NAME" \
                --location="$GCP_REGION" --project="$GCP_PROJECT_ID"
            fi
          done
          QUEUE_NAME="$TASK_QUEUE_BASE"

          SCHEDULER_STATE="$(gcloud scheduler jobs describe background-tasks-reconcile \
            --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(state)')"
          if [[ "$SCHEDULER_STATE" != "ENABLED" ]]; then
            gcloud scheduler jobs resume background-tasks-reconcile \
              --location="$GCP_REGION" --project="$GCP_PROJECT_ID"
          fi

  deploy-frontend:
    name: Deploy nexo-frontend
    needs: [detect, ci-gate, build-frontend, deploy-api, deploy-worker]
    if: >
      always() && !cancelled()
      && needs.ci-gate.result == 'success'
      && needs.detect.outputs.frontend == 'true'
      && needs.build-frontend.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SHA: ${{ needs.detect.outputs.git_sha }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Compose Cloud Run refs
        run: |
          set -euo pipefail
          {
            echo "IMG=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}"
            echo "SA_RUN_EMAIL=${SA_RUN}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_ENV"

      - name: Deploy nexo-frontend
        run: |
          set -euo pipefail
          # NEXT_PUBLIC_* in browser code is frozen by the frontend build args above;
          # runtime values keep Next.js server-side execution consistent.
          gcloud run deploy nexo-frontend \
            --image="$IMG/nexo-frontend:sha-$SHA" --region="$GCP_REGION" --allow-unauthenticated \
            --service-account="$SA_RUN_EMAIL" --port=8080 \
            --min-instances=0 --max-instances=10 \
            --clear-vpc-connector \
            --concurrency=80 --timeout=300 \
            --cpu=1 --memory=512Mi --cpu-boost --cpu-throttling \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ vars.GCP_API_BASE_URL }},NEXT_PUBLIC_WS_URL=${{ vars.GCP_API_BASE_URL }}"

  verify-production:
    name: Verify production
    needs:
      [
        detect,
        ci-gate,
        deploy-api,
        deploy-worker,
        deploy-realtime-relay,
        activate-tasks,
        deploy-frontend,
      ]
    if: always() && !cancelled() && (needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require completed release stages
        env:
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WORKER_RESULT: ${{ needs.deploy-worker.result }}
          RELAY_RESULT: ${{ needs.deploy-realtime-relay.result }}
          TASKS_RESULT: ${{ needs.activate-tasks.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
        run: |
          set -euo pipefail

          if [[ "$CI_GATE_RESULT" != "success" ]]; then
            echo "::error::CI gate must succeed before production verification (was $CI_GATE_RESULT)."
            exit 1
          fi

          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            for stage in "API:$API_RESULT" "worker:$WORKER_RESULT" "realtime relay:$RELAY_RESULT" "Cloud Tasks activation:$TASKS_RESULT"; do
              name="${stage%%:*}"
              result="${stage#*:}"
              if [[ "$result" != "success" ]]; then
                echo "::error::$name must succeed for a backend release (was $result)."
                exit 1
              fi
            done
          fi

          if [[ "$FRONTEND_CHANGED" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Frontend deploy must succeed for a frontend release (was $FRONTEND_RESULT)."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
      - uses: google-github-actions/setup-gcloud@v3

      # WIF ADC is an external account: `gcloud auth print-identity-token --audiences`
      # rejects it. Mint the Cloud Run ID token via IAM Credentials after the live URL is known.
      - id: worker-url
        if: needs.detect.outputs.backend == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          url="$(gcloud run services describe nexo-worker \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')"
          url="${url%/}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          configured='${{ vars.GCP_WORKER_SERVICE_URL }}'
          configured="${configured%/}"
          if [[ -n "$configured" && "$configured" != "$url" ]]; then
            echo "::warning::GCP_WORKER_SERVICE_URL ($configured) differs from live nexo-worker URL ($url). Cloud Tasks OIDC audience must match the service origin."
          fi

      # Cloud Run rejects ID tokens without the email claim as unauthenticated
      # (Google HTML 404, not 403). include_email maps the token to the CI SA.
      - id: auth-worker
        if: needs.detect.outputs.backend == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
          token_format: id_token
          id_token_audience: ${{ steps.worker-url.outputs.url }}
          id_token_include_email: true

      - id: relay-url
        if: needs.detect.outputs.backend == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          url="$(gcloud run services describe nexo-realtime-relay --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - id: auth-relay
        if: needs.detect.outputs.backend == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GH_SA_CICD }}
          token_format: id_token
          id_token_audience: ${{ steps.relay-url.outputs.url }}
          id_token_include_email: true

      - name: Verify changed production surfaces
        env:
          RELAY_URL: ${{ steps.relay-url.outputs.url }}
          RELAY_ID_TOKEN: ${{ steps.auth-relay.outputs.id_token }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TASKS_QUEUE_NAME: ${{ vars.GCP_TASKS_QUEUE_NAME }}
          WORKER_URL: ${{ steps.worker-url.outputs.url }}
          WORKER_ID_TOKEN: ${{ steps.auth-worker.outputs.id_token }}
          GCP_API_BASE_URL: ${{ vars.GCP_API_BASE_URL }}
          PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail

          curl_check() {
            local name="$1"
            local url="$2"
            shift 2
            echo "Checking $name at $url"
            # Do not follow redirects: GFE may drop Authorization and return a
            # Google HTML 404. Do not retry 4xx (--retry-all-errors would).
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 \
              "$@" "$url"
            echo
          }

          assert_run_cost_flags() {
            local service="$1"
            local want_min="$2"
            local want_max="$3"
            local want_timeout="$4"
            local want_cpu="${5:-true}"
            local desc min_scale max_scale timeout cpu
            desc="$(gcloud run services describe "$service" \
              --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json)"
            min_scale="$(printf '%s' "$desc" | jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0"')"
            max_scale="$(printf '%s' "$desc" | jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // ""')"
            timeout="$(printf '%s' "$desc" | jq -r '.spec.template.spec.timeoutSeconds')"
            cpu="$(printf '%s' "$desc" | jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // "true"' | tr '[:upper:]' '[:lower:]')"
            if [[ "$min_scale" != "$want_min" ]]; then
              echo "::error::$service minScale is $min_scale; expected $want_min."
              exit 1
            fi
            if [[ "$max_scale" != "$want_max" ]]; then
              echo "::error::$service maxScale is $max_scale; expected $want_max."
              exit 1
            fi
            if [[ "$timeout" != "$want_timeout" ]]; then
              echo "::error::$service timeoutSeconds is $timeout; expected $want_timeout."
              exit 1
            fi
            if [[ "$cpu" != "$want_cpu" ]]; then
              echo "::error::$service cpu-throttling is $cpu; expected $want_cpu."
              exit 1
            fi
          }

          assert_prisma_connection_limit() {
            local service="$1"
            local want_limit="$2"
            local desc limit
            desc="$(gcloud run services describe "$service" \
              --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json)"
            # Un deploy que pierda PRISMA_CONNECTION_LIMIT deja a Prisma con su
            # default interno (10 en la API), que es justo el escenario que agoto
            # los slots de Cloud SQL. La revision debe traer el valor explicito.
            limit="$(printf '%s' "$desc" | jq -r \
              '[.spec.template.spec.containers[0].env[]?
                | select(.name == "PRISMA_CONNECTION_LIMIT") | .value][0] // ""')"
            if [[ "$limit" != "$want_limit" ]]; then
              echo "::error::$service PRISMA_CONNECTION_LIMIT is '${limit:-<unset>}'; expected $want_limit."
              exit 1
            fi
          }

          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            API_URL="$(gcloud run services describe nexo-api \
              --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
              --format='value(status.url)')"

            curl_check "nexo-api readiness" "$API_URL/ready"
            # Use /ready, not /healthz: Google Frontend swallows the literal
            # `/healthz` path on run.app and returns its own HTML 404, so the
            # request never reaches the container. Both paths share one handler.
            curl_check "nexo-worker health" "$WORKER_URL/ready" \
              -H "Authorization: Bearer $WORKER_ID_TOKEN"

            assert_run_cost_flags nexo-api 0 "$DB_MAX_INSTANCES" 3600
            assert_run_cost_flags nexo-worker 0 "$DB_MAX_INSTANCES" 300

            # Presupuesto de conexiones: el pool explicito por revision debe
            # coincidir con el valor presupuestado en `env:` (docs/CLOUD_SQL_CONNECTION.md).
            assert_prisma_connection_limit nexo-api "$DB_CONNECTION_LIMIT"
            assert_prisma_connection_limit nexo-worker "$DB_WORKER_CONNECTION_LIMIT"

            POOL_TOTAL=$(( DB_MAX_INSTANCES * DB_CONNECTION_LIMIT \
              + DB_MAX_INSTANCES * DB_WORKER_CONNECTION_LIMIT \
              + DB_RELAY_MAX_INSTANCES * DB_RELAY_CONNECTION_LIMIT ))
            echo "::notice::Cloud SQL peor caso (api+worker+relay): $POOL_TOTAL conexiones (+1 migrator). Debe quedar muy por debajo del max_connections medido; si no, escala el tier antes de subir instancias o pools."

            curl_check "nexo-realtime-relay readiness" "$RELAY_URL/ready" \
              -H "Authorization: Bearer $RELAY_ID_TOKEN"
            assert_run_cost_flags nexo-realtime-relay 0 "$DB_RELAY_MAX_INSTANCES" 300
            assert_prisma_connection_limit nexo-realtime-relay "$DB_RELAY_CONNECTION_LIMIT"
            for VERIFY_QUEUE in "$TASKS_QUEUE_NAME" "$TASKS_QUEUE_NAME-ai" "$TASKS_QUEUE_NAME-delivery" "$TASKS_QUEUE_NAME-documents"; do
              QUEUE_STATE="$(gcloud tasks queues describe "$VERIFY_QUEUE" \
                --location "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(state)')"
              [[ "$QUEUE_STATE" == "RUNNING" ]] \
                || { echo "::error::Queue $VERIFY_QUEUE is $QUEUE_STATE; expected RUNNING."; exit 1; }
            done
            SCHEDULER_STATE="$(gcloud scheduler jobs describe background-tasks-reconcile \
              --location "$GCP_REGION" --project "$GCP_PROJECT_ID" \
              --format='value(state)')"

            [[ "$QUEUE_STATE" == "RUNNING" ]] \
              || { echo "::error::Cloud Tasks queue is $QUEUE_STATE; expected RUNNING."; exit 1; }
            [[ "$SCHEDULER_STATE" == "ENABLED" ]] \
              || { echo "::error::Reconciliation scheduler is $SCHEDULER_STATE; expected ENABLED."; exit 1; }

            # Pub/Sub realtime transport: topics must exist, and the push
            # subscriptions must deliver to the public API with an OIDC token
            # whose audience and identity match PUBSUB_PUSH_AUDIENCE /
            # PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL on the API runtime.
            API_AUDIENCE="${GCP_API_BASE_URL%/}"
            for topic in realtime-events ai-stream socketio-adapter; do
              gcloud pubsub topics describe "$topic" \
                --project "$GCP_PROJECT_ID" >/dev/null 2>&1 \
                || { echo "::error::Pub/Sub topic $topic is missing; run deploy-infrastructure.sh first."; exit 1; }
            done

            verify_push_subscription() {
              local sub="$1" expected_endpoint="$2" desc endpoint audience sa ordering
              desc="$(gcloud pubsub subscriptions describe "$sub" \
                --project "$GCP_PROJECT_ID" --format=json)"
              endpoint="$(printf '%s' "$desc" | jq -r '.pushConfig.pushEndpoint // ""')"
              audience="$(printf '%s' "$desc" | jq -r '.pushConfig.oidcToken.audience // ""')"
              sa="$(printf '%s' "$desc" | jq -r '.pushConfig.oidcToken.serviceAccountEmail // ""')"
              ordering="$(printf '%s' "$desc" | jq -r '.enableMessageOrdering // false')"
              [[ "$endpoint" == "$expected_endpoint" ]] \
                || { echo "::error::$sub pushEndpoint is $endpoint; expected $expected_endpoint."; exit 1; }
              [[ "$audience" == "$API_AUDIENCE" ]] \
                || { echo "::error::$sub OIDC audience is $audience; expected $API_AUDIENCE (must equal PUBSUB_PUSH_AUDIENCE)."; exit 1; }
              [[ "$sa" == "$PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL" ]] \
                || { echo "::error::$sub OIDC identity is $sa; expected $PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL."; exit 1; }
              [[ "$ordering" == "true" ]] \
                || { echo "::error::$sub message ordering is $ordering; expected true."; exit 1; }
            }
            verify_push_subscription realtime-events-push "$API_AUDIENCE/pubsub/realtime"
            verify_push_subscription ai-stream-push "$API_AUDIENCE/pubsub/ai-stream"

            echo "::notice::nexo-api -> $API_URL"
            echo "::notice::nexo-worker -> $WORKER_URL"
          fi

          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            FRONTEND_URL="$(gcloud run services describe nexo-frontend \
              --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
              --format='value(status.url)')"
            curl_check "nexo-frontend" "$FRONTEND_URL/"
            assert_run_cost_flags nexo-frontend 0 10 300
            echo "::notice::nexo-frontend -> $FRONTEND_URL"
          fi
